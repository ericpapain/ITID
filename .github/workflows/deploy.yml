name: 🚀 CI/CD - Build & Déploiement Automatique ITID

on:
  push:
    branches:
      - main
      - blog_modif
  workflow_dispatch: # Permet de déclencher le déploiement manuellement depuis l'onglet Actions de GitHub

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: 🔨 Build & Déploiement Hostinger / OVH
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupération du code source
        uses: actions/checkout@v4

      - name: ⚙️ Configuration de Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Installation des dépendances
        run: npm ci

      - name: 🏗️ Compilation du projet (Vite build)
        run: npm run build

      - name: 🛡️ Vérification des fichiers du build
        run: |
          echo "Vérification des dossiers clés dans dist/:"
          ls -la dist/ || { echo "::error::Le dossier dist/ est manquant."; exit 1; }
          if [ -d "dist/api" ]; then
            echo "✅ dist/api trouvé avec succès"
            ls -la dist/api/
          else
            echo "::error::dist/api est manquant — le build n'a pas produit les fichiers API attendus"
            exit 1
          fi

      - name: 🔍 Vérification de la configuration des Secrets GitHub
        run: |
          if [ -z "${{ secrets.FTP_SERVER }}" ] || [ -z "${{ secrets.FTP_USERNAME }}" ] || [ -z "${{ secrets.FTP_PASSWORD }}" ]; then
            echo "::error::Les secrets FTP ne sont pas encore renseignés dans GitHub !"
            echo "Rendez-vous dans GitHub > Settings > Secrets and variables > Actions et ajoutez :"
            echo "- FTP_SERVER (ex: 46.202.172.176 ou ftp.itid-france.com)"
            echo "- FTP_USERNAME (votre identifiant FTP)"
            echo "- FTP_PASSWORD (votre mot de passe FTP)"
            echo "Optionnel : FTP_SERVER_DIR (par défaut: public_html/)"
            exit 1
          fi

      - name: 🚀 Déploiement vers Hostinger (via lftp mirror ultra-fiable)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
          CUSTOM_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          sudo apt-get update -y
          sudo apt-get install -y lftp

          echo "🔍 Détection automatique du répertoire distant..."
          # Déterminer la racine réelle : si CUSTOM_DIR est fourni on le respecte,
          # sinon on teste si public_html existe, sinon on se place à la racine ./
          TARGET_DIR="${CUSTOM_DIR}"
          if [ -z "$TARGET_DIR" ]; then
            if lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_SERVER" -e "set ssl:verify-certificate no; cd public_html; bye" 2>/dev/null; then
              echo "✅ Dossier public_html/ détecté"
              TARGET_DIR="public_html/"
            else
              echo "✅ L'utilisateur FTP pointe déjà directement sur la racine web"
              TARGET_DIR="./"
            fi
          fi

          echo "📦 Synchronisation en cours vers '$TARGET_DIR'..."
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_SERVER" <<EOF
          set ssl:verify-certificate no;
          set ftp:ssl-allow yes;
          set ftp:ssl-protect-data yes;
          set ftp:passive-mode yes;
          set net:timeout 30;
          set net:max-retries 3;
          mirror -R \
            --verbose \
            --parallel=3 \
            --exclude-glob .git* \
            --exclude-glob *.sqlite* \
            --exclude-glob *.db* \
            --exclude-glob itid_data/ \
            --exclude-glob uploads/ \
            --exclude-glob api/config.php \
            --exclude-glob *.bak* \
            dist/ "\$TARGET_DIR"
          bye
          EOF
          echo "🎉 Déploiement terminé avec succès sur Hostinger !"