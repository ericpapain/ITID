name: 🚀 CI/CD - Build & Déploiement Automatique ITID

on:
  push:
    branches:
      - main
      - blog_modif
  workflow_dispatch: # Permet de déclencher le déploiement manuellement depuis l'onglet Actions de GitHub

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: 🔨 Build & Déploiement Hostinger / OVH
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupération du code source
        uses: actions/checkout@v4

      - name: ⚙️ Configuration de Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Installation des dépendances
        run: npm ci

      - name: 🏗️ Compilation du projet (Vite build)
        run: npm run build

      - name: 🛡️ Vérification des fichiers du build & Protection de la base
        run: |
          echo "Vérification des dossiers clés dans dist/:"
          ls -la dist/ || { echo "::error::Le dossier dist/ est manquant."; exit 1; }
          # Supprimer tout fichier .sqlite ou .db résiduel dans dist/ pour ne jamais écraser les données réelles du serveur
          find dist -name "*.sqlite*" -delete 2>/dev/null || true
          find dist -name "*.db*" -delete 2>/dev/null || true
          rm -rf dist/uploads dist/itid_data 2>/dev/null || true
          if [ -d "dist/api" ]; then
            echo "✅ dist/api trouvé avec succès"
            ls -la dist/api/
          else
            echo "::error::dist/api est manquant — le build n'a pas produit les fichiers API attendus"
            exit 1
          fi

      - name: 🔍 Vérification de la configuration des Secrets GitHub
        run: |
          if [ -z "${{ secrets.FTP_SERVER }}" ] || [ -z "${{ secrets.FTP_USERNAME }}" ] || [ -z "${{ secrets.FTP_PASSWORD }}" ]; then
            echo "::error::Les secrets FTP ne sont pas encore renseignés dans GitHub !"
            echo "Rendez-vous dans GitHub > Settings > Secrets and variables > Actions et ajoutez :"
            echo "- FTP_SERVER (ex: 46.202.172.176 ou ftp.itid-france.com)"
            echo "- FTP_USERNAME (votre identifiant FTP)"
            echo "- FTP_PASSWORD (votre mot de passe FTP)"
            echo "Optionnel : FTP_SERVER_DIR (par défaut: public_html/)"
            exit 1
          fi

      - name: 🚀 Déploiement vers Hostinger (via lftp mirror ultra-fiable)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
          CUSTOM_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          sudo apt-get update -y
          sudo apt-get install -y lftp

          # Debug: show remote root to help find the correct path early
          echo "🔍 Listing remote root for debug:"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" -e "set ssl:verify-certificate no; set ftp:ssl-allow yes; set ftp:passive-mode yes; pwd; ls -la; bye" "$FTP_SERVER" || true

          # Prepare cleaned secret path
          RAW_DIR=$(printf '%s' "${CUSTOM_DIR:-}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          CLEAN_DIR=$(printf '%s' "$RAW_DIR" | sed -e 's|^/||' -e 's|/$||')

          TARGET_DIR=""

          lftp_check() {
            CMD="$1"
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" -e "set ssl:verify-certificate no; set ftp:ssl-allow yes; set ftp:passive-mode yes; $CMD; bye" "$FTP_SERVER" >/dev/null 2>&1
          }

          candidates=()

          # If user provided a path, try it first
          if [ -n "$CLEAN_DIR" ] && [ "$CLEAN_DIR" != "." ]; then
            candidates+=("$CLEAN_DIR")
          fi

          # Common defaults and username-based guesses
          candidates+=( "public_html" "www" "html" "domains/${FTP_USERNAME}/public_html" "home/${FTP_USERNAME}/public_html" "public/${FTP_USERNAME}" )

          # Try all candidates
          for d in "${candidates[@]}"; do
            echo "Trying remote path: '$d'..."
            if lftp_check "cd \"$d\""; then
              echo "✅ Found remote directory: $d"
              TARGET_DIR="$d"
              break
            fi
          done

          # If still not found, try to search root for any entry named public_html (useful on multi-domain hosts)
          if [ -z "$TARGET_DIR" ]; then
            echo "🔎 Searching remote root for directories containing 'public_html'..."
            FOUND_PATHS=$(lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" -e "set ssl:verify-certificate no; set ftp:ssl-allow yes; set ftp:passive-mode yes; cls -1; bye" "$FTP_SERVER" 2>/dev/null | grep -i 'public_html' || true)
            for p in $FOUND_PATHS; do
              echo "Trying discovered path: '$p'..."
              if lftp_check "cd \"$p\""; then
                echo "✅ Found remote directory via discovery: $p"
                TARGET_DIR="$p"
                break
              fi
            done
          fi

          # Final fallback: if nothing is found, keep deploying to the FTP root but include debug listing
          if [ -z "$TARGET_DIR" ]; then
            echo "::warning::No suitable public directory found. Will deploy to FTP root. Remote root listing for debug:"
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" -e "set ssl:verify-certificate no; set ftp:ssl-allow yes; set ftp:passive-mode yes; pwd; ls -la; bye" "$FTP_SERVER" || true
          else
            echo "📦 Déploiement ciblé vers : $TARGET_DIR"
          fi

          # Préparation du script LFTP avec indentation YAML valide
          {
            echo "set cmd:fail-exit yes;"
            echo "set ssl:verify-certificate no;"
            echo "set ftp:ssl-allow yes;"
            echo "set ftp:ssl-protect-data yes;"
            echo "set ftp:passive-mode yes;"
            echo "set ftp:use-site-chmod false;"
            echo "set ftp:use-allo false;"
            echo "set xfer:use-temp-file false;"
            echo "set mirror:set-permissions off;"
            echo "set mirror:dereference yes;"
            echo "set net:timeout 120;"
            echo "set net:max-retries 5;"
            echo "set net:reconnect-interval-base 5;"
            if [ -n "$TARGET_DIR" ]; then
              echo "cd \"$TARGET_DIR\";"
            fi
            echo "mirror -R --continue --verbose --parallel=2 --no-perms --no-umask --exclude-glob .git* --exclude-glob *.sqlite* --exclude-glob *.db* --exclude-glob */itid.sqlite* --exclude-glob itid_data/ --exclude-glob uploads/ --exclude-glob api/config.php --exclude-glob api/data/*.sqlite* --exclude-glob api/data/*.db* --exclude-glob *.bak* dist ."
            echo "bye"
          } > deploy_script.lftp

          echo "📄 Script de synchronisation préparé :"
          cat deploy_script.lftp

          echo "🚀 Synchronisation des fichiers avec LFTP..."
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_SERVER" < deploy_script.lftp
          rm -f deploy_script.lftp
          echo "🎉 Déploiement terminé avec succès sur l'hébergeur !"